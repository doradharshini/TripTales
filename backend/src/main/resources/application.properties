spring.application.name=triptales-backend

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/triptales}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=8080

# Serve the Vite build in packaged runs and when the backend is started directly
# from the project root or backend module in the IDE.
spring.web.resources.static-locations=classpath:/META-INF/resources/,classpath:/resources/,classpath:/static/,classpath:/public/,file:frontend/dist/,file:../frontend/dist/